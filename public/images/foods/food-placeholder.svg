<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Outer Plate Rim -->
  <circle cx="100" cy="100" r="64" fill="url(#plateGrad)" stroke="#10b981" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="100" cy="100" r="48" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.4"/>
  
  <!-- Food / Utensils Icon Center -->
  <g transform="translate(100, 100) scale(1.15)" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Fork -->
    <path d="M-18 -22 v14 c0 4 3 7 7 7 v18" />
    <path d="M-14 -22 v10" />
    <path d="M-22 -22 v10" />
    
    <!-- Knife -->
    <path d="M18 -22 v39" />
    <path d="M18 -22 c-6 4 -6 14 0 17" />

    <!-- Healthy Leaf in plate center -->
    <path d="M-4 6 c-2 -8 6 -14 12 -14 c0 6 -6 14 -12 14 z" fill="#10b981" fill-opacity="0.25" stroke="#059669" stroke-width="2" />
  </g>
  
  <!-- Subtitle -->
  <text x="100" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857" opacity="0.85">NutriTrack Food</text>
</svg>

